<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>Aligo · 智能旅行助手</title>
  <script src="/static/theme.js?v=1.3.0"></script>
  <link rel="stylesheet" href="/static/style.css?v=1.3.0" />
</head>
<body>
  <svg class="sprite" aria-hidden="true">
    <symbol id="i-route" viewBox="0 0 24 24">
      <path d="M5 18C9 18 8 7 12 7s3 11 7 11" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="2.5 3"/>
      <circle cx="5" cy="18" r="2.1" fill="currentColor"/>
      <circle cx="19" cy="18" r="2.3" fill="none" stroke="currentColor" stroke-width="1.7"/>
    </symbol>
    <symbol id="i-plus" viewBox="0 0 24 24">
      <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-panel" viewBox="0 0 24 24">
      <rect x="3.5" y="4.5" width="17" height="15" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <path d="M9.5 4.5v15" fill="none" stroke="currentColor" stroke-width="1.6"/>
    </symbol>
    <symbol id="i-menu" viewBox="0 0 24 24">
      <path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-sun" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="3.6" fill="none" stroke="currentColor" stroke-width="1.7"/>
      <path d="M12 2.8v2M12 19.2v2M2.8 12h2M19.2 12h2M5.5 5.5l1.4 1.4M17.1 17.1l1.4 1.4M18.5 5.5l-1.4 1.4M6.9 17.1l-1.4 1.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-moon" viewBox="0 0 24 24">
      <path d="M20 14.2A8.2 8.2 0 0 1 9.8 4 8.2 8.2 0 1 0 20 14.2Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-close" viewBox="0 0 24 24">
      <path d="m6 6 12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-search" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.7"/>
      <path d="m16 16 4 4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-download" viewBox="0 0 24 24">
      <path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-edit" viewBox="0 0 24 24">
      <path d="M4 20h4L18.5 9.5a2.1 2.1 0 0 0-3-3L5 17v3Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
      <path d="m13.5 7.5 3 3" fill="none" stroke="currentColor" stroke-width="1.7"/>
    </symbol>
    <symbol id="i-link" viewBox="0 0 24 24">
      <path d="M10 14a4.5 4.5 0 0 0 6.4 0l2.2-2.2a4.5 4.5 0 0 0-6.4-6.4L11 6.6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      <path d="M14 10a4.5 4.5 0 0 0-6.4 0l-2.2 2.2a4.5 4.5 0 0 0 6.4 6.4l1.2-1.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-pin" viewBox="0 0 24 24">
      <path d="M9.2 4h5.6l-.7 5 3.4 3.4H6.5L9.9 9l-.7-5Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M12 12.4V20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24">
      <rect x="4" y="5.5" width="16" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <path d="M4 9.5h16M8 3.5v4M16 3.5v4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24">
      <path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-copy" viewBox="0 0 24 24">
      <rect x="9" y="9" width="11" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <path d="M15 5.5A1.5 1.5 0 0 0 13.5 4h-8A1.5 1.5 0 0 0 4 5.5v8A1.5 1.5 0 0 0 5.5 15" fill="none" stroke="currentColor" stroke-width="1.6"/>
    </symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24">
      <path d="M4.5 12a7.5 7.5 0 0 1 12.8-5.3L20 9.5M20 4.5v5h-5M19.5 12a7.5 7.5 0 0 1-12.8 5.3L4 14.5M4 19.5v-5h5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-trash" viewBox="0 0 24 24">
      <path d="M4.5 7h15M9.5 7V4.8h5V7M7 7l.8 12.2h8.4L17 7M10.2 10.5v5.5M13.8 10.5v5.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-arrow-up" viewBox="0 0 24 24">
      <path d="M12 19V5M6.5 10.5 12 5l5.5 5.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-stop" viewBox="0 0 24 24">
      <rect x="7" y="7" width="10" height="10" rx="1.6" fill="currentColor"/>
    </symbol>
    <symbol id="i-map" viewBox="0 0 24 24">
      <path d="M9 4 4 6v14l5-2 6 2 5-2V4l-5 2-6-2Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M9 4v14M15 6v14" fill="none" stroke="currentColor" stroke-width="1.6"/>
    </symbol>
    <symbol id="i-weather" viewBox="0 0 24 24">
      <circle cx="12" cy="9" r="3.4" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <path d="M12 3v1.6M5.8 9H4.2M19.8 9h-1.6M7.6 4.6 6.5 3.5M16.4 4.6l1.1-1.1M8 16.5h8.5a3.5 3.5 0 1 0-1-6.9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-doc" viewBox="0 0 24 24">
      <path d="M7 3.5h7l4 4v13H7v-17Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M14 3.5v4h4M10 11h5M10 14.5h5M10 18h3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-spark" viewBox="0 0 24 24">
      <path d="M12 3.5c.6 4.6 2.9 6.9 7.5 7.5-4.6.6-6.9 2.9-7.5 7.5-.6-4.6-2.9-6.9-7.5-7.5 4.6-.6 6.9-2.9 7.5-7.5Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M18.8 16.2c.2 1.5.9 2.2 2.4 2.4-1.5.2-2.2.9-2.4 2.4-.2-1.5-.9-2.2-2.4-2.4 1.5-.2 2.2-.9 2.4-2.4Z" fill="currentColor"/>
    </symbol>
  </svg>

  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="会话与账户">
      <div class="side-head">
        <a class="brand" href="#" id="brandHome" aria-label="开始新对话">
          <span class="brand-mark"><svg class="icon"><use href="#i-route"></use></svg></span>
          <span class="brand-text"><strong>Aligo</strong><small>智能旅行助手</small></span>
        </a>
        <button class="icon-btn side-collapse" id="collapseSidebar" type="button" title="收起侧栏" aria-label="收起侧栏">
          <svg class="icon"><use href="#i-panel"></use></svg>
        </button>
      </div>

      <button class="new-chat" id="newSession" type="button">
        <svg class="icon"><use href="#i-plus"></use></svg>
        新对话
      </button>

      <label class="search" for="historySearch">
        <svg class="icon"><use href="#i-search"></use></svg>
        <input id="historySearch" type="search" maxlength="100" placeholder="搜索对话" autocomplete="off" aria-label="搜索对话" />
      </label>

      <button class="upcoming" id="upcoming" type="button" hidden>
        <span class="upcoming-label">即将出行</span>
        <span class="upcoming-route" id="upcomingRoute"></span>
        <span class="upcoming-date" id="upcomingDate"></span>
      </button>

      <nav class="history" id="history" aria-label="历史对话"></nav>

      <button class="user-card" id="openMemory" type="button" title="记忆与数据">
        <span class="avatar" id="userAvatar">旅</span>
        <span class="user-meta">
          <strong id="userLabel">web_user</strong>
          <small id="storageLabel">本地存储</small>
        </span>
        <svg class="icon user-chevron"><use href="#i-chevron"></use></svg>
      </button>
    </aside>

    <div class="scrim" id="scrim" hidden></div>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" type="button" title="展开 / 收起侧栏" aria-label="展开或收起侧栏">
          <svg class="icon"><use href="#i-menu"></use></svg>
        </button>
        <div class="conv-title">
          <h1 id="convTitle">新对话</h1>
          <span class="model-chip" id="modelChip">DeepSeek</span>
        </div>
        <div class="topbar-right">
          <button class="icon-btn" id="copyLink" type="button" title="复制对话链接" aria-label="复制对话链接" hidden>
            <svg class="icon"><use href="#i-link"></use></svg>
          </button>
          <button class="icon-btn" id="exportChat" type="button" title="导出对话（Markdown）" aria-label="导出对话" hidden>
            <svg class="icon"><use href="#i-download"></use></svg>
          </button>
          <span class="health" id="health" title="服务状态"><i></i><span id="healthText">连接中</span></span>
          <button class="icon-btn" id="themeToggle" type="button" title="切换主题" aria-label="切换主题">
            <svg class="icon"><use href="#i-moon"></use></svg>
          </button>
        </div>
      </header>

      <div class="scroll" id="scroll">
        <div class="thread" id="messages">
          <div class="welcome" data-welcome>
            <div class="welcome-route" aria-hidden="true">
              <svg viewBox="0 0 220 84" fill="none">
                <path d="M14 70C58 70 52 18 110 18s52 52 96 52" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 6" stroke-linecap="round" opacity=".5"/>
                <circle cx="14" cy="70" r="5" fill="currentColor"/>
                <circle cx="110" cy="18" r="3.5" fill="var(--accent)"/>
                <circle cx="206" cy="70" r="7" stroke="currentColor" stroke-width="2"/>
                <circle cx="206" cy="70" r="2.5" fill="currentColor"/>
              </svg>
            </div>
            <h2>下一站，去哪里？</h2>
            <p>描述一次出行，我来规划行程、查天气、核对差旅标准，并记住你的偏好。</p>
            <div class="suggestions">
              <button type="button" class="suggestion" data-example="帮我规划下周一从北京去杭州出差 3 天，我喜欢住汉庭">
                <span class="s-icon"><svg class="icon"><use href="#i-map"></use></svg></span>
                <span class="s-copy"><strong>安排一次出差</strong><small>下周一北京去杭州 3 天，偏好汉庭</small></span>
              </button>
              <button type="button" class="suggestion" data-example="杭州明天天气怎么样？">
                <span class="s-icon"><svg class="icon"><use href="#i-weather"></use></svg></span>
                <span class="s-copy"><strong>查一下天气</strong><small>杭州明天天气怎么样</small></span>
              </button>
              <button type="button" class="suggestion" data-example="一线城市住宿标准是多少？">
                <span class="s-icon"><svg class="icon"><use href="#i-doc"></use></svg></span>
                <span class="s-copy"><strong>核对差旅标准</strong><small>一线城市住宿标准是多少</small></span>
              </button>
              <button type="button" class="suggestion" data-example="我之前说过哪些出行偏好？">
                <span class="s-icon"><svg class="icon"><use href="#i-spark"></use></svg></span>
                <span class="s-copy"><strong>回顾我的偏好</strong><small>我之前说过哪些出行偏好</small></span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="composer-zone">
        <form class="composer" id="composer">
          <textarea id="input" rows="1" maxlength="4000" placeholder="说说你的出行计划，例如：下周一从北京去杭州出差 3 天" aria-label="输入消息"></textarea>
          <div class="composer-row">
            <span class="hint">Enter 发送 · Shift + Enter 换行</span>
            <button class="stop-btn" id="stopBtn" type="button" hidden>
              <svg class="icon"><use href="#i-stop"></use></svg>停止
            </button>
            <button class="send-btn" id="sendBtn" type="submit" title="发送" aria-label="发送">
              <svg class="icon"><use href="#i-arrow-up"></use></svg>
            </button>
          </div>
        </form>
        <p class="composer-note">Aligo 会记住你的出行偏好 · 回答由 AI 生成，请核对关键信息</p>
      </div>
    </main>
  </div>

  <div class="sheet" id="memorySheet" hidden>
    <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <header class="sheet-head">
        <div>
          <h2 id="sheetTitle">记忆与数据</h2>
          <p>同一个用户 ID 共享偏好与历史行程</p>
        </div>
        <button class="icon-btn" id="closeMemory" type="button" aria-label="关闭">
          <svg class="icon"><use href="#i-close"></use></svg>
        </button>
      </header>

      <label class="field">
        <span>用户 ID</span>
        <input id="userId" type="text" maxlength="64" autocomplete="off" placeholder="输入用户 ID" />
      </label>
      <div class="sheet-tools">
        <button class="ghost" id="saveUser" type="button">保存并切换</button>
        <button class="ghost" id="exportData" type="button">导出 JSON</button>
        <button class="ghost" id="exportDataMd" type="button">导出 Markdown</button>
      </div>

      <section class="sheet-section">
        <h3>存储后端</h3>
        <div class="chips" id="storageChips"></div>
      </section>
      <section class="sheet-section">
        <h3>偏好</h3>
        <div class="pref-list" id="overview">加载中…</div>
      </section>
      <section class="sheet-section">
        <h3>最近行程</h3>
        <div class="trip-list" id="trips"></div>
      </section>
      <section class="sheet-section">
        <h3>统计</h3>
        <div class="stat-grid" id="stats"></div>
      </section>
      <section class="sheet-section">
        <h3>模型用量</h3>
        <div class="stat-grid" id="usageStats"></div>
        <div class="chips usage-agents" id="usageAgents"></div>
        <div class="usage-trend" id="usageTrend" hidden>
          <div class="usage-trend-head">
            <span>近 7 天 tokens</span>
            <span id="usageTrendTotal"></span>
          </div>
          <div class="usage-chart" id="usageChart" role="img" aria-label="近 7 天模型 tokens 用量柱状图"></div>
          <table class="sr-only" id="usageTable"></table>
        </div>
      </section>
    </div>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="/static/app.js?v=1.3.0"></script>
</body>
</html>
