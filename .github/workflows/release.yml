# 发布流程：推送 v* 标签时自动构建 sdist/wheel 并创建 GitHub Release
# （借鉴 MiQroForge 的 release workflow，按 Python 项目简化为最小流程）
#
# 使用方式：
#   git tag v1.0.1 && git push origin v1.0.1
# 发布前请同步更新 CHANGELOG.md。
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装打包工具
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: 构建 sdist 与 wheel
        run: python -m build

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
