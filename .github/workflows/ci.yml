# 持续集成：代码风格（ruff）、类型检查（mypy）、无需 API Key 的回归测试（pytest）
#
# 说明：
# - 只安装轻量依赖（requirements-ci.txt），不安装 torch / pymilvus /
#   sentence-transformers 等重型 RAG 依赖；缺少依赖或密钥的测试会自动跳过；
# - CI 中不会调用真实大模型，构建快速且无需任何密钥；
# - 测试矩阵覆盖项目声明的 Python 3.10 与 3.12。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 代码检查与测试（Python ${{ matrix.python-version }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aligo
          POSTGRES_PASSWORD: aligo
          POSTGRES_DB: aligo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aligo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # 存储后端集成测试使用 service 容器；未配置时相关用例自动跳过
      TEST_REDIS_URL: redis://localhost:6379/0
      TEST_POSTGRES_DSN: postgresql://aligo:aligo@localhost:5432/aligo
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: 安装轻量依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: 代码风格检查（ruff）
        run: python -m ruff check .

      - name: 类型检查（mypy）
        run: python -m mypy .

      - name: 回归测试（pytest，无需 API Key）
        run: python -m pytest tests/ -q
